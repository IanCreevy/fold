workflows:
  android-internal:
    name: Fold Android internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 21
      node: 22
      android_signing:
        - fold
    scripts:
      - name: Install, build web, sync Android
        script: |
          npm ci
          npm run build
          npx cap sync android
      - name: Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # Attach the Android keystore in the Codemagic UI (android_signing) before
    # uploading the AAB. Publishing stays manual until both stores are ready.

  ios-testflight:
    name: Fold iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.navigatorofshame.fold
    scripts:
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Add iOS project on the Mac builder if it is not in git
        script: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx capacitor-assets generate --ios --iconBackgroundColor "#7eb6d6" --splashBackgroundColor "#d7ecf8"
          npx cap sync ios
      - name: Sign and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Turn on App Store Connect publishing in the Codemagic UI when the
    # organization migration is finished and the Fold app record exists.
